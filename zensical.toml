[project]
site_name = "The MERC Project"
site_url = "https://MERCorg.github.io/merc-website/"
repo_url = "https://github.com/MERCorg/merc/"
repo_name = "MERCorg/merc"

extra_css = ["stylesheets/extra.css"]

nav = [
  { Home = "index.md" },
  { Tools = [
    "tools/reordering.md",
    "tools/mbt-protocol.md",
  ] },
  { Language = [
    { "Parsing" = [
      "language/parsing/disambiguation.md",
      "language/parsing/performance.md",
      "language/parsing/precedence.md",
      "language/parsing/source_map.md",
    ] },
    { "Type Checking" = [
      "language/typechecking/index.md",
      "language/typechecking/name-resolution.md",
      "language/typechecking/desugaring.md",
      "language/typechecking/signature.md",
      "language/typechecking/system-specification.md",
      "language/typechecking/polymorphism.md",
      "language/typechecking/sort-inference.md",
      { "Inference" = [
        "language/typechecking/inference/ranked-backtracking.md",
        "language/typechecking/inference/unification.md",
      ] },
      "language/typechecking/typing-info.md",
    ] },
    { "Specification" = [
      "language/specification/index.md",
    ] },
  ] },
  { Rewriting = [
    { "Terms" = [
      "rewriting/terms/aterms.md",
      "rewriting/terms/protection-sets.md",
    ] },
    { "Rewriters" = [
      "rewriting/rewriters/conditional-rewriting.md",
      "rewriting/rewriters/set-automaton.md",
      "rewriting/rewriters/innermost.md",
      "rewriting/rewriters/jitty.md",
      "rewriting/rewriters/condition-caching.md",
    ] },
    { "Data" = [
      "rewriting/data/machine-numbers.md",
      "rewriting/data/enumeration.md",
      "rewriting/data/quantifiers.md",
      "rewriting/data/lowering.md",
    ] },
  ] },
  { "Model checking" = [
    { "PBES" = [
      "model-checking/pbes/pbes.md",
      "model-checking/pbes/counter_examples.md",
      "model-checking/pbes/srf_transformation.md",
      "model-checking/pbes/pres.md",
    ] },
    { "Symmetry" = [
      "model-checking/symmetry/symmetry-detection-graph.md",
      "model-checking/symmetry/canonicalize-orbit.md",
    ] },
    { "Parity games" = [
      "model-checking/parity/parity_games.md",
      "model-checking/parity/strategy-improvement.md",
      "model-checking/parity/exponential-constructions.md",
      "model-checking/parity/hybrid-strategy-improvement.md",
    ] },
    { "Symbolic" = [
      "model-checking/symbolic/saturation.md",
      "model-checking/symbolic/zielonka.md",
      "model-checking/symbolic/partial-solving.md",
      "model-checking/symbolic/copy-nodes.md",
    ] },
  ] },
  { Benchmarks = [
    "benchmarks/index.md",
    "benchmarks/rewriting.md",
    "benchmarks/parsing.md",
    "benchmarks/symbolic.md",
  ] },
  { Contributing = [
    "contributing/general.md",
    "contributing/testing.md",
    "contributing/documentation.md",
    "contributing/publishing.md",
  ] },
  { Links = [
    { "Issue Tracker" = "https://github.com/MERCorg/merc/issues" },
    { Documentation = "https://MERCorg.github.io/merc/" },
    { Coverage = "https://MERCorg.github.io/merc/coverage/" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.tabs",
]

[[project.theme.palette]]
scheme = "slate"
primary = "amber"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "amber"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.highlight]
use_pygments = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.latex_math]

# URLs of pages that moved; merc and merc-verified cite the old ones.
[project.plugins.redirects.redirect_maps]
"developer/documentation.md" = "contributing/documentation.md"
"developer/general.md" = "contributing/general.md"
